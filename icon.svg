<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#0f172a"/>
  <rect x="0" y="256" width="512" height="256" rx="0" fill="#0f172a"/>
  <rect x="0" y="416" width="512" height="96" rx="0" fill="#0f172a"/>
  <rect x="416" y="256" width="96" height="256" rx="96" fill="#0f172a"/>
  <rect x="0" y="256" width="96" height="256" rx="0" fill="#0f172a"/>
  <!-- Clean rounded square bg -->
