  <!-- P — right side -->
  <text x="384" y="320" font-family="Georgia, serif" font-size="220" font-weight="900" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" letter-spacing="-4">P</text>
  <!-- bottom label -->
